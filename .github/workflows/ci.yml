name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  version-bump:
    name: Require plugin version bump
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Check plugin.json version vs merge-base
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/check-version-bump.sh "origin/$BASE_REF"

  package-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: bash -n plugins/composio/hooks/session-start.sh plugins/composio/hooks/user-prompt-submit.sh
      - run: python -m unittest discover -s tests -v
